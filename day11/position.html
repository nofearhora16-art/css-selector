<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            height: 100vh;
            width: 100vw;
            background-color: bisque;
            padding: 20px;
        }
        .box{
            height: 100px;
            width: 80%;
            background-color: red;
            margin-bottom: 10px;
        }
        .box2{
           background-color: aquamarine;
           position: relative;
           top: 20px;
           left: 30px;
        }
        .box3{
            background-color: green;
            position: absolute;
            top: 400px;
            right: 200px;
        }
        .box1{
            height: 100px;
            width: 100px;
            position: fixed;
            border-radius: 50%;
            top: 200px;
            left: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
      <div class="box box1"></div>  
      <div class="box box2"></div>
      <div class="box box3"></div>
    </div>
</body>
</html>
