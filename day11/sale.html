<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .container{
            height: 60vh;
            width: 60vw;
            background-color: bisque;
            position: relative;
        }
        .box{
            background-color: aqua;
            height: 50px;
            width: 100px;
            border: 2px solid black;
            border-radius: 10px;
            color: red;
            font-weight: bold;
            font-size: 20px;
            position: absolute;
            right: 20px;
            top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
      <div class="box">sale</div>
    </div>
</body>
</html>
