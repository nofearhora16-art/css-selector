<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
       div{
            color: red;
            background-color: aqua;
            padding: 50px;
            position:relative;
            position: sticky;
            top: 0;
        }
        li{
            display: inline-block;
        }
        ul{
            position: absolute;
            right: 10px;
        }
        body{
            height: 400vh;
        }
    </style>
</head>
<body> 
    <div>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>contact</li>
        </ul>
    </div>
</body>
</html>
