<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        padding: 10px;
        border: 2px solid black;
        border-radius: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .group {
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: center;
      }
      img {
        border: 2px solid red;
        border-radius: 20px;
      }
      p {
        font-size: 28px;
        color: red;
      }
      .gap {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="group">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHmXi18ws8vNJxwV-PyIDrqsZ3shJczekQHjMWnWVRIw&s=10"
          alt="burger"
          height="200px"
        />
        <div class="gap">
          <h1>Burger</h1>
          <h2>cheese Burger</h2>
        </div>
      </div>
      <p>Remove</p>
    </div>
  </body>
</html>
