<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: aqua;
        }
        .container{
            height: 50px;
            width: 100%;
            border: 2px solid blue;
           padding: 10px;
           display: flex;
           align-items: center;
           justify-content: space-between;

        }
        ul{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        li{
            font-size: 20px;
            color: red;
            background-color:aquamarine;
            border: 2px solid black;
            border-radius:10px;
            padding: 10px;
            list-style-type: none;
        }
        .logo{
            font-size: 30px;
            color: red;
            border: 2px solid black;
            border-radius: 50px;
            background: aquamarine;
            height: 60px;
            width: 60px;
            display: flex ;
            justify-content: center;
            align-items: center;
        }
        .button{
            color: red;
            padding: 10px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: aquamarine;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            logo

        </div>
      <ul>
        <li>home</li>
        <li>About</li>
        <li>contact</li>
      </ul>
      <div>
        <button class="button">singup</button>
        <button class="button">login</button>
      </div>

    </div>
</body>
</html>
